<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker planning</title>
  <meta name="description" content="Poker planning de l'équipe, sans publicité.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <script>
    // Thème appliqué avant l'affichage : choix mémorisé, sinon réglage du système.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('poker-planning.theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="app.css?v=__VERSION__">
  <script defer src="vendor/qrcode-generator-1.4.4.js?v=__VERSION__"></script>
  <script type="module" src="js/theme.js?v=__VERSION__"></script>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-card" aria-hidden="true"></span>Poker planning</h1>
    <div class="topbar-actions">
      <div class="me" id="me" hidden>
        <span class="me-name" id="me-name"></span>
        <button type="button" class="link-button" id="change-pseudo">Changer de pseudo</button>
        <button type="button" class="button button-ghost button-small" id="leave">Quitter</button>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Passer en thème sombre" title="Passer en thème sombre">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main>
    <!-- Chargement / erreur bloquante -->
    <section class="screen" id="screen-status">
      <p class="status-text" id="status-text">Connexion…</p>
    </section>

    <!-- Choix du pseudo -->
    <section class="screen" id="screen-pseudo" hidden>
      <form class="pseudo-form" id="pseudo-form" novalidate>
        <h2>Bienvenue !</h2>
        <label for="pseudo-input">Votre pseudo</label>
        <input id="pseudo-input" name="pseudo" autocomplete="nickname" autocapitalize="words" spellcheck="false" maxlength="40" required>
        <p class="error" id="pseudo-error" role="alert" aria-live="assertive"></p>
        <div class="form-actions">
          <button type="button" class="button button-ghost" id="pseudo-cancel" hidden>Annuler</button>
          <button type="submit" class="button button-primary" id="pseudo-submit">Entrer dans la salle</button>
        </div>
      </form>
    </section>

    <!-- Après « Quitter », si le navigateur refuse de fermer l'onglet -->
    <section class="screen" id="screen-left" hidden>
      <div class="left-card">
        <h2 id="left-title">Vous avez quitté la salle</h2>
        <p>Vous pouvez fermer cet onglet.</p>
        <button type="button" class="button button-primary" id="rejoin">Revenir dans la salle</button>
      </div>
    </section>

    <!-- Salle -->
    <section class="screen room" id="screen-room" hidden>
      <section class="panel participants-panel" aria-labelledby="participants-title">
        <div class="panel-head">
          <h2 id="participants-title">Présents</h2>
          <span class="count" id="vote-count"></span>
        </div>
        <ul class="participants" id="participants"></ul>
        <div class="actions">
          <button type="button" class="button button-primary" id="reveal">Révéler</button>
          <button type="button" class="button button-ghost" id="new-round">Nouveau vote</button>
        </div>
        <div class="share-row">
          <button type="button" class="link-button" id="share-link">Partager le lien</button>
          <span class="share-status" id="share-status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <div class="side">
        <section class="panel join-card" id="join-card" aria-labelledby="join-title" hidden>
          <button type="button" class="qr-button" id="qr-open" aria-label="Agrandir le QR code" title="Agrandir">
            <span class="qr" id="qr-small"></span>
          </button>
          <div class="join-text">
            <h2 id="join-title">Rejoindre avec un téléphone</h2>
            <p class="join-hint">Scannez le QR code, ou ouvrez&nbsp;:</p>
            <p class="join-url" id="join-url"></p>
          </div>
        </section>

        <section class="panel results" id="results" aria-labelledby="results-title" hidden>
          <h2 id="results-title">Résultats</h2>
          <div class="results-grid">
            <div class="stat">
              <span class="stat-label">Moyenne</span>
              <span class="stat-value" id="mean"></span>
            </div>
            <div class="stat stat-wide">
              <span class="stat-label">Répartition</span>
              <ul class="distribution" id="distribution"></ul>
            </div>
          </div>
          <p class="notice notice-success" id="consensus" hidden></p>
          <p class="notice notice-warning" id="scissors-alert" hidden></p>
        </section>
      </div>

      <section class="deck-panel" aria-labelledby="deck-title">
        <h2 id="deck-title" class="deck-title">Votre carte</h2>
        <div class="deck" id="deck" role="group" aria-labelledby="deck-title"></div>
        <p class="hint" id="deck-hint"></p>
      </section>
    </section>
  </main>

  <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-dialog-title">
    <h2 id="qr-dialog-title">Rejoindre avec un téléphone</h2>
    <div class="qr qr-large" id="qr-large"></div>
    <p class="join-url" id="qr-dialog-url"></p>
    <button type="button" class="button button-primary" id="qr-close">Fermer</button>
  </dialog>
</body>
</html>
